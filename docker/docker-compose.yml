services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_copilot
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  copilot-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: utiliti_copilot_app
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    volumes:
      - ../data:/app/data
    restart: always

volumes:
  qdrant_storage: